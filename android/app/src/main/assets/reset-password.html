<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — NEXORA AI</title>
  <meta name="description" content="Choose a new password for your NEXORA AI account.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="ambient-glow top-left"></div>
  <div class="ambient-glow bottom-right"></div>

  <!-- Top Bar Theme Toggle -->
  <div class="auth-top-bar">
    <button class="btn-theme-toggle" title="Switch to Black Theme" aria-label="Toggle Theme">
      <span class="theme-icon-dark">🌙</span>
      <span class="theme-icon-light" style="display:none;">☀️</span>
    </button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="/" class="brand-logo">
          <img src="/assets/logo.png" alt="NEXORA AI Logo" class="brand-logo-img">
          <span class="brand-title">NEXORA <span class="brand-accent">AI</span></span>
        </a>
        <p class="auth-subtitle">Set your new NEXORA AI password</p>
      </div>

      <form id="reset-password-form">
        <div class="form-group" id="token-field-group">
          <label class="form-label" for="token">Reset Security Token</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="text" id="token" class="input-field" placeholder="Paste reset token from email" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="newPassword" class="input-field" placeholder="Min. 8 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="newPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirmPassword" class="input-field" placeholder="Re-enter new password" required autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 10px;">
          Update Password
        </button>
      </form>

      <div class="auth-footer">
        Back to <a href="/login">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
