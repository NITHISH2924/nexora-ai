version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_PATH=data/nexora_prod.db
      - UPLOAD_DIR=data/uploads
      - SECURE_COOKIES=true
    volumes:
      - app_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/chat/models"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app_data:
    driver: local
